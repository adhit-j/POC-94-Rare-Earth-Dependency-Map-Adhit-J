services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: rare_earth_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: always

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    container_name: rare_earth_frontend
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
    depends_on:
      - backend
    restart: always
